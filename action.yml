---
name: 'LuaRocks tag release'
description: 'Publish a package to LuaRocks when a new tag is pushed'
author: 'Marc Jakobi'
branding:
  color: 'purple'
  icon: 'moon'
inputs:
  name:
    description: "The name of the your package"
    required: true
    default: ${{ github.event.repository.name }}
  version:
    description: |
      The version of your package. Uses the git tag by default (if one exists).
      Can also be set to `null`, `"scm"` or `"dev"` to publish a development rockspec.
    required: false
    default: ${{ github.ref_name }}
  dependencies:
    description: "List of LuaRocks dependencies."
    required: false
  test_dependencies:
    description: "List of test suite dependencies."
    required: false
  labels:
    description: "List of package labels."
    required: false
  copy_directories:
    description: |
      List of additional directories to copy.
      Only directories that exist will be copied.
      The defaults are taken from Neovim's `:help runtimepath`
      WARNING: Do not add the directories `lua`, `lib` or `rock_manifest`.
    required: true
    default: |
      {{ neovim.plugin.dirs }}
  summary:
    description: "Short description of the package."
    required: false
  detailed_description:
    description: "Detailed description of the package."
    required: false
  template:
    description: |
      Path to a custom extra.rockspec.
      Use this to customise the generated project's build specification, dependencies,
      or other fields that cannot be expressed through the action inputs.
      Lux merges the extra.rockspec over the generated lux.toml.
    required: false
  license:
    description: |
      The license SPDX identifier.
      By default, it will be fetched from GitHub.
      But sometimes, GitHub does not recognise it,
      in which case LuaRocks will fall back to this one.
    required: false
  extra_luarocks_args:
    description: |
      Deprecated: extra args to pass to the luarocks command.
      Mapped to lux flags (e.g. `KEY=VALUE` becomes `--variables KEY=VALUE`).
    required: false
  extra_lux_args:
    description: "Extra args to pass to the lux command."
    required: false
  gpg_private_key:
    description: |
      GPG private key used to sign the uploaded rockspec.
      When unset, uploads are not signed.
    required: false
  gpg_passphrase:
    description: "Passphrase for the GPG private key, if any."
    required: false
  sign_protocol:
    description: |
      GPG signing protocol used by lux when a GPG key is provided.
      Ignored when `gpg_private_key` is unset.
    required: false
    default: "default"
  fail_on_duplicate:
    description: |
      Whether to fail if the rock's version has already been published to `luarocks.org`.
    required: false
  lua_version:
    description: |
      The Lua version to build, test and publish with.
    required: false
    default: "5.1"
  lux_version:
    description: |
      The lux version to install and run.
    required: false
    default: "0.52.2"
runs:
  using: "composite"
  steps:
    - name: Install Lua
      uses: luarocks/gh-actions-lua@v14
      with:
        luaVersion: ${{ inputs.lua_version }}

    - name: Install Lux
      uses: lumen-oss/gh-actions-lux@v1
      with:
        version: ${{ inputs.lux_version }}

    - name: Install Lua build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get install -y libreadline-dev
      shell: bash

    - name: Install luarocks-tag-release
      run: |
        lx --lua-version "${{ inputs.lua_version }}" \
          --no-luarc --tree "$RUNNER_TEMP/lux-tree" \
          install --path "${{ github.action_path }}"
        # The action installs itself from its own lux.toml (see the previous step).
        # When the action is dogfooded in CI, github.action_path is also the workspace.
        # This removes the action's own lux.toml, which lets the tool generate a project
        # from the workflow inputs instead.
        rm -f "${{ github.action_path }}/lux.toml"
      shell: bash

    - name: Import GPG key
      if: inputs.gpg_private_key != ''
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}
        passphrase: ${{ inputs.gpg_passphrase }}

    - name: Generate rockspec
      run: >-
        lx --lua-version "${{ inputs.lua_version }}"
        --tree "$RUNNER_TEMP/lux-tree"
        exec --no-loader luarocks-tag-release-action.lua generate
        --name "${{ inputs.name }}"
        --version "${{ inputs.version }}"
        --dependencies "${{ inputs.dependencies }}"
        --test-dependencies "${{ inputs.test_dependencies }}"
        --labels "${{ inputs.labels }}"
        --copy-directories "${{ inputs.copy_directories }}"
        --summary "${{ inputs.summary }}"
        --detailed-description "${{ inputs.detailed_description }}"
        --template "${{ inputs.template }}"
        --license "${{ inputs.license }}"
        --extra-luarocks-args "${{ inputs.extra_luarocks_args }}"
        --extra-lux-args "${{ inputs.extra_lux_args }}"
        --lua-version "${{ inputs.lua_version }}"
      shell: bash

    - name: Upload rockspec
      if: github.event_name != 'pull_request'
      run: >-
        lx --lua-version "${{ inputs.lua_version }}"
        --tree "$RUNNER_TEMP/lux-tree"
        exec --no-loader luarocks-tag-release-action.lua upload
        --extra-luarocks-args "${{ inputs.extra_luarocks_args }}"
        --extra-lux-args "${{ inputs.extra_lux_args }}"
        --lua-version "${{ inputs.lua_version }}"
        --fail-on-duplicate "${{ inputs.fail_on_duplicate == 'true' }}"
      env:
        LTR_SIGN_PROTOCOL: ${{ inputs.gpg_private_key != '' && inputs.sign_protocol || 'none' }}
      shell: bash

    - name: Test published package
      if: github.event_name != 'pull_request'
      run: >-
        lx --lua-version "${{ inputs.lua_version }}"
        --tree "$RUNNER_TEMP/lux-tree"
        exec --no-loader luarocks-tag-release-action.lua test
        --name "${{ inputs.name }}"
        --version "${{ inputs.version }}"
        --extra-luarocks-args "${{ inputs.extra_luarocks_args }}"
        --extra-lux-args "${{ inputs.extra_lux_args }}"
        --lua-version "${{ inputs.lua_version }}"
      shell: bash
