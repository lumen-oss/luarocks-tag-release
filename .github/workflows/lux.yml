---
name: lux
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: luarocks/gh-actions-lua@v11
        with:
          luaVersion: "5.5"
      - uses: lumen-oss/gh-actions-lux@v1
        with:
          version: "0.47.0"
      - run: lx check --warnings-as-errors

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: luarocks/gh-actions-lua@v11
        with:
          luaVersion: "5.5"
      - uses: lumen-oss/gh-actions-lux@v1
        with:
          version: "0.47.0"
      - run: lx test
